name: Profit Engine CI

on:
  push:
    branches:
      - profit-engine
  pull_request:
    branches:
      - profit-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python tests
        env:
          PYTHONPATH: profit-engine/runtime
        run: python -m unittest discover -s profit-engine/runtime/tests -v

      - name: Node tests
        run: node --test profit-engine/sites/dilivox/tests/*.test.cjs

      - name: Validate JSON artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('profit-engine').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK {path}')
          PY

      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD
