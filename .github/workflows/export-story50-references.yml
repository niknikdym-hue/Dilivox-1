name: Export story 50 references

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/export-story50-references.yml'

permissions:
  contents: read

jobs:
  export-references:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload approved story 50 references
        uses: actions/upload-artifact@v4
        with:
          name: story50-approved-references
          path: |
            50-pechat-na-bagrovom-voske/approved-characters/*.png
            50-pechat-na-bagrovom-voske/02-queens-reception-room-approved-reference.png
          if-no-files-found: error
          retention-days: 1
